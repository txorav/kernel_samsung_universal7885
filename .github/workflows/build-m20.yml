name: Build m20lte kernel (grapheneos-fixes)

on:
  push:
    branches: [grapheneos-fixes]
  workflow_dispatch:
    inputs:
      defconfig:
        description: 'Defconfig to build'
        required: false
        default: 'exynos7885-m20_gsi_defconfig'

jobs:
  build:
    runs-on: ubuntu-20.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install deps
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libncurses5-dev \
            ccache lib32z1 lib32stdc++6 python2 python-is-python2 \
            zip unzip cpio device-tree-compiler lzop libtinfo5

      - name: Show toolchain
        run: |
          ls prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/ || true
          chmod +x prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/* || true
          prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-gcc --version || true
          gcc --version
          python --version
          make --version | head -1

      - name: Build kernel (m20 GSI)
        run: |
          set -e
          DEFCONFIG="${{ github.event.inputs.defconfig }}"
          if [ -z "$DEFCONFIG" ]; then DEFCONFIG="exynos7885-m20_gsi_defconfig"; fi
          echo "DEFCONFIG=$DEFCONFIG"
          export ARCH=arm64
          export CROSS_COMPILE=$PWD/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9/bin/aarch64-linux-android-
          # 4.4 Makefile forces HOSTCC='ccache gcc'; ensure ccache exists
          export CCACHE_DIR=$HOME/.ccache
          mkdir -p out
          make ARCH=arm64 O=out $DEFCONFIG
          make ARCH=arm64 O=out -j$(nproc) Image dtbs modules 2>&1 | tee out/build.log
          echo "=== outputs ==="
          ls -lh out/arch/arm64/boot/Image || true
          ls -lh out/arch/arm64/boot/dts/exynos/*.dtb 2>/dev/null | head || true
          find out -name "*.ko" | head

      - name: Package AnyKernel3 + raw Image
        run: |
          set -e
          export ARCH=arm64
          # raw Image
          mkdir -p dist
          cp out/arch/arm64/boot/Image dist/Image-m20lte-grapheneos-fixes || cp arch/arm64/boot/Image dist/ || true
          # modules
          mkdir -p dist/modules
          find out -name "*.ko" -exec cp {} dist/modules/ \; || true
          cp out/build.log dist/ || true
          cp out/.config dist/defconfig_used || true
          # AnyKernel3 zip (TWRP flashable)
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git dist/AnyKernel3-template || true
          rm -rf AnyKernel3
          cp -r dist/AnyKernel3-template AnyKernel3
          rm -rf AnyKernel3/.git
          cp dist/Image-m20lte-grapheneos-fixes AnyKernel3/zImage 2>/dev/null || cp dist/Image AnyKernel3/zImage || true
          # minimal anykernel.sh tweak for exynos7885/m20lte
          cat > AnyKernel3/anykernel.sh << 'EOS'
          # AnyKernel3 Ramdisk Mod Script
          properties() { '
          kernel.string=GrapheneOS m20lte fixes by txorav
          do.devicecheck=1
          do.modules=0
          do.systemless=1
          supported.versions=
          supported.devices=m20lte,m20ltedd,universal7885
          '; }
          . tools/ak3-core.sh;
          dump_boot;
          write_boot;
          ## end install
          EOS
          (cd AnyKernel3 && zip -r9 ../dist/AnyKernel3-m20lte-grapheneos-fixes.zip . -x .git/\*)
          ls -lh dist/

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: m20lte-grapheneos-fixes
          path: dist/
          if-no-files-found: error
